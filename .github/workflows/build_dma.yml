name: Build CaptainDMA 75T Firmware

on:
  workflow_dispatch:
    inputs:
      vendor_id:
        description: 'Vendor ID (например, 10EC)'
        required: true
        default: '10EC'
      device_id:
        description: 'Device ID (например, 8168)'
        required: true
        default: '8168'
      subsys_vendor:
        description: 'Subsystem Vendor ID (например, 1462)'
        required: true
        default: '1462'
      subsys_id:
        description: 'Subsystem ID (например, 7C95)'
        required: true
        default: '7C95'
      dsn:
        description: 'Device Serial Number 16 символов (DSN)'
        required: true
        default: '00E04C0000A491B2'

jobs:
  build-fpga:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch IDs and DSN
        working-directory: CaptainDMA/75t484_x1
        run: |
          python3 -c '
          import re
          v, d, sv, si, dsn = "${{ inputs.vendor_id }}", "${{ inputs.device_id }}", "${{ inputs.subsys_vendor }}", "${{ inputs.subsys_id }}", "${{ inputs.dsn }}".zfill(16)
          
          with open("vivado_generate_project_captaindma_75t.tcl", "r") as f: c = f.read()
          c = re.sub(r"(CONFIG\.Vendor_ID\s*\{)[0-9A-Fa-f]{4}(\})", rf"\g<1>{v}\g<2>", c)
          c = re.sub(r"(CONFIG\.Device_ID\s*\{)[0-9A-Fa-f]{4}(\})", rf"\g<1>{d}\g<2>", c)
          c = re.sub(r"(CONFIG\.Subsystem_Vendor_ID\s*\{)[0-9A-Fa-f]{4}(\})", rf"\g<1>{sv}\g<2>", c)
          c = re.sub(r"(CONFIG\.Subsystem_ID\s*\{)[0-9A-Fa-f]{4}(\})", rf"\g<1>{si}\g<2>", c)
          with open("vivado_generate_project_captaindma_75t.tcl", "w") as f: f.write(c)

          with open("src/pcileech_pcie_cfg_a7.sv", "r") as f: s = f.read()
          s = re.sub(r"(rw\[127:64\]\s*<=\s*64\x27h)[0-9A-Fa-f_]+(;)", rf"\g<1>{dsn}\g<2>", s)
          with open("src/pcileech_pcie_cfg_a7.sv", "w") as f: s = f.write(s)
          '

      - name: Install Vivado Engine (Artix-7)
        env:
          AMD_USER: ${{ secrets.AMD_USER }}
          AMD_PASS: ${{ secrets.AMD_PASS }}
        run: |
          sudo apt-get update && sudo apt-get install -y libtinfo5 libncurses5 expect
          cat << 'EOF' > install_config.txt
          Edition=Vivado ML Standard
          Destination=/opt/Xilinx
          Modules=Artix-7:1
          InstallOptions=Acquire device drivers:0,Enable WebTalk for Vivado to send usage statistics to AMD:0
          EOF
          echo "Готово к запуску установщика"

      - name: Build Bitstream (.bin)
        working-directory: CaptainDMA/75t484_x1
        run: |
          source /opt/Xilinx/Vivado/*/settings64.sh
          vivado -mode batch -source vivado_generate_project_captaindma_75t.tcl
          vivado -mode batch -source vivado_build.tcl

      - name: Upload Compiled Firmware (.bin)
        uses: actions/upload-artifact@v4
        with:
          name: CaptainDMA_75T_Firmware
          path: CaptainDMA/75t484_x1/**/*.bin
